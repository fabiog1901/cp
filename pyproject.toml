[project]
name = "cp"
version = "0.1.0"
description = "cp"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = "Apache 2.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cpkit @ git+https://github.com/fabiog1901/cpkit.git@main",
    "psycopg (>=3.3.3,<4.0.0)",
    "psycopg-binary (>=3.3.3,<4.0.0)",
    "fastapi[standard] (>=0.135.3,<0.136.0)",
    "psycopg-pool (>=3.3.0,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "boto3 (>=1.35.0,<2.0.0)",
    "botocore (>=1.43.13,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.1"
mkdocstrings = {extras = ["python"], version = "^1.0.4"}

[project.scripts]
cp = "cpkit.cli:main"

[tool.cpkit]
app_import = "cp.main:app"
ddl = [
    "resources/ddl.sql",
    "resources/post_schema.sql",
]
schema_checks = [
    "public.clusters",
]

[tool.black]
target-version = ["py314"]

[tool.isort]
profile = "black"
