site_name: CP
site_description: Control plane for a CockroachDB DBaaS platform.
repo_name: fabiog1901/cp
repo_url: https://github.com/fabiog1901/cp

docs_dir: docs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

theme:
  name: material
  icon:
    logo: material/database-cog
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: brown
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: brown
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference
  features:
    - content.code.annotate
    - content.code.copy
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Curated Code Map: CODEMAP.md
  - Generated:
      - Code Map: generated/code-map.md
      - Package Index: generated/package-index.md
      - API Routes: generated/api/routes.md
      - LLM Index: generated/llm-index.md
      - Python Reference: generated/python-reference.md
  - Architecture:
      - Documentation System: architecture/documentation-system.md
  - Domains:
      - Overview: domains/index.md
      - Cluster Lifecycle: domains/cluster-lifecycle.md
      - Database Access: domains/database-access.md
      - Backups and Recovery: domains/backups-and-recovery.md
      - Admin Configuration: domains/admin-configuration.md
      - Auth and Authorization: domains/auth-and-authorization.md
      - Events, Alerts, Dashboard: domains/events-alerts-dashboard.md
